<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SkinLedger{% endblock %}</title>
  <meta name="description" content="Is it working or not? Know before you rebuy.">
  <meta name="theme-color" content="#1f6f5c">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><strong>SkinLedger</strong></li>
      </ul>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/timeline">Timeline</a></li>
        <li><a href="/products">Products</a></li>
        <li><a href="/routine">Routine</a></li>
      </ul>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="container">
    <small>{{ disclaimer }}</small>
    <small>{{ powered_by }}</small>
  </footer>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function () {});
      });
    }
  </script>
</body>
</html>
